name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArkaTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ArkaTV-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ArkaTV-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "ArkaTV (dernier build)" --notes "APK de debug compilée depuis $GITHUB_SHA."
