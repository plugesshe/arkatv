name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk && ls -l app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: ArkaTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore
      # In-app updates: the app reads version.json from the "dev" pre-release. Publishing every green
      # build of this branch was authorised by the repository owner on 2026-11-27.
      - name: Publish the build for in-app updates
        if: github.ref == 'refs/heads/claude/arkatv-excellence'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ArkaTV-dev.apk
          jq -n \
            --argjson versionCode "$((1000 + GITHUB_RUN_NUMBER))" \
            --arg versionName "$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" \
            --arg sha256 "$(sha256sum ArkaTV-dev.apk | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s ArkaTV-dev.apk)" \
            --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $versionCode, versionName: $versionName, sha256: $sha256, size: $size, notes: $notes}' > version.json
          cat version.json
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "ArkaTV (builds de développement)" \
            --notes "Builds de debug en cours de développement, utilisés par la mise à jour intégrée. Instables par nature."
          gh release upload dev ArkaTV-dev.apk --clobber
          gh release upload dev version.json --clobber
      # The rolling "latest" pre-release is only refreshed from the validated 0.1 branch,
      # never from work-in-progress branches.
      - name: Publish APK as the "latest" pre-release
        if: github.ref == 'refs/heads/claude/arkatv-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ArkaTV-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ArkaTV-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "ArkaTV (dernier build)" --notes "APK de debug compilée depuis $GITHUB_SHA."
